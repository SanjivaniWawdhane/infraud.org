  <!-- ═══════════════════════════════════════════
       PREMIUM FLOATING NAV V2
  ════════════════════════════════════════════ -->
  <header class="premium-nav-wrapper">
    <div class="premium-nav">
      
      <!-- Logo -->
      <a href="/" class="premium-nav-logo">
        <img src="assets/logo.jpg" alt="INFRAUD logo" />
        <span>INFRAUD</span>
      </a>

      <!-- Menu -->
      <nav class="premium-nav-menu">
        <a href="/" class="nav-item active">Home</a>
        <a href="check.html" class="nav-item">Check</a>
        <a href="reports.html" class="nav-item">Reports</a>
        <a href="learn.html" class="nav-item">Learn</a>
        <a href="about.html" class="nav-item">About</a>
      </nav>

      <!-- Actions -->
      <div class="premium-nav-actions">
        <a href="login.html" class="nav-login">Log in</a>
        <a href="signup.html" class="nav-signup">Sign up <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></a>
        
        <button class="nav-hamburger" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6"  x2="21" y2="6"  />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
      </div>

    </div>

    <style>
      /* Wrapper to center the floating nav */
      .premium-nav-wrapper {
        position: fixed;
        top: 24px;
        left: 0;
        right: 0;
        z-index: 500;
        display: flex;
        justify-content: center;
        pointer-events: none; /* Let clicks pass through the wrapper */
        font-family: var(--font, 'Inter', sans-serif);
      }

      /* The actual floating pill */
      .premium-nav {
        pointer-events: auto; /* Re-enable clicks for the nav itself */
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 40px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(10, 15, 30, 0.06);
        box-shadow: 
          0 4px 24px -4px rgba(10, 15, 30, 0.08), 
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        padding: 8px 12px 8px 16px;
        border-radius: 100px;
        transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      
      /* Subtle shrink effect when scrolling down (managed by JS) */
      .premium-nav.scrolled {
        top: 16px;
        padding: 6px 10px 6px 14px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 12px 32px -4px rgba(10, 15, 30, 0.12);
      }

      /* Logo */
      .premium-nav-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .premium-nav-logo img {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        transition: transform 0.2s;
      }
      .premium-nav-logo:hover img { transform: scale(1.05); }
      .premium-nav-logo span {
        font-weight: 800;
        font-size: 1.125rem;
        letter-spacing: -0.02em;
        color: var(--ink-900, #0A0F1E);
      }

      /* Desktop Menu */
      .premium-nav-menu {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .nav-item {
        position: relative;
        text-decoration: none;
        font-size: 0.9375rem;
        font-weight: 600;
        color: var(--ink-500, #4B5570);
        padding: 8px 16px;
        border-radius: 100px;
        transition: color 0.2s;
      }
      .nav-item:hover { color: var(--ink-900, #0A0F1E); }
      .nav-item.active { color: var(--ink-900, #0A0F1E); background: var(--ink-50, #F4F5FA); }
      
      /* Animated hover pill background (CSS only) */
      .nav-item::before {
        content: ''; position: absolute; inset: 0; border-radius: 100px;
        background: var(--ink-100, #E8EBF3);
        opacity: 0; transform: scale(0.9);
        transition: all 0.2s; z-index: -1;
      }
      .nav-item:hover::before { opacity: 1; transform: scale(1); }
      .nav-item.active::before { display: none; }

      /* Actions */
      .premium-nav-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nav-login {
        text-decoration: none;
        font-size: 0.9375rem;
        font-weight: 600;
        color: var(--ink-700, #1E2742);
        padding: 8px 12px;
        transition: color 0.2s;
      }
      .nav-login:hover { color: var(--blue-600, #2563EB); }

      .nav-signup {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--ink-900, #0A0F1E);
        color: #fff;
        text-decoration: none;
        font-size: 0.9375rem;
        font-weight: 700;
        padding: 10px 20px;
        border-radius: 100px;
        box-shadow: 0 4px 12px rgba(10,15,30,0.15);
        transition: all 0.2s;
      }
      .nav-signup svg { width: 14px; height: 14px; transition: transform 0.2s; }
      .nav-signup:hover { background: var(--blue-600, #2563EB); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37,99,235,0.25); }
      .nav-signup:hover svg { transform: translateX(2px); }

      /* Hamburger (Mobile) */
      .nav-hamburger {
        display: none;
        background: none; border: none; cursor: pointer; color: var(--ink-900, #0A0F1E);
        padding: 8px; border-radius: 50%; background: var(--ink-50, #F4F5FA);
      }
      
      @media (max-width: 900px) {
        .premium-nav { width: calc(100% - 32px); gap: 16px; }
        .premium-nav-menu, .nav-login, .nav-signup { display: none; }
        .nav-hamburger { display: flex; align-items: center; justify-content: center; }
      }
    </style>
    <script>
      window.addEventListener('scroll', () => {
        const nav = document.querySelector('.premium-nav');
        if(window.scrollY > 20) {
          nav.classList.add('scrolled');
        } else {
          nav.classList.remove('scrolled');
        }
      }, { passive: true });
    </script>
  </header>
