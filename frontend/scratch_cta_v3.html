    <!-- ═══════════════════════════════════════════
         FINAL CTA — V3 ULTRA PREMIUM DARK
    ════════════════════════════════════════════ -->
    <section class="final-cta-section">

      <!-- Background Architecture -->
      <div class="cta-bg-grid"></div>
      <div class="cta-bg-glow cta-glow-left"></div>
      <div class="cta-bg-glow cta-glow-right"></div>
      <div class="cta-bg-glow cta-glow-center"></div>

      <div class="container" style="position: relative; z-index: 10;">
        
        <!-- Eyebrow -->
        <div class="cta-eyebrow-wrapper">
          <div class="cta-eyebrow">
            <span class="pulse-dot"></span>
            Live Threat Engine Active
          </div>
        </div>

        <!-- Headline -->
        <h2 class="cta-headline">
          <div class="cta-line cta-l1">Before you <span class="text-gray">click.</span></div>
          <div class="cta-line cta-l2">Before you <span class="text-gray">pay.</span></div>
          <div class="cta-line cta-l3"><span class="text-gradient">Check first.</span></div>
        </h2>
        
        <p class="cta-sub">
          It takes under <strong>2 seconds</strong>. It could save you significantly more.
        </p>

        <!-- Premium Glass Search Widget -->
        <div class="cta-widget-wrapper">
          <div class="cta-widget">
            
            <!-- Sweeping laser line -->
            <div class="cta-widget-laser"></div>

            <div class="cta-widget-top">
              <div class="cta-engine-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                Powered by INFRAUD
              </div>
              <div class="cta-live-badge">LIVE</div>
            </div>

            <div class="cta-widget-input-row">
              <svg class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="cta-input" placeholder="Paste a suspicious URL, phone, or UPI ID..." autocomplete="off" />
              <button class="cta-analyze-btn" onclick="if(document.getElementById('cta-input').value){window.location='check.html?q='+encodeURIComponent(document.getElementById('cta-input').value);}">
                Analyze
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </button>
            </div>

            <div class="cta-widget-tags">
              <button class="cta-tag active" onclick="ctaSelectTag(this, 'Paste a suspicious URL e.g. amazon-secure-refund.in...')">URL</button>
              <button class="cta-tag" onclick="ctaSelectTag(this, 'Enter a phone number...')">Phone</button>
              <button class="cta-tag" onclick="ctaSelectTag(this, 'Enter a UPI handle...')">UPI ID</button>
              <button class="cta-tag" onclick="ctaSelectTag(this, 'Paste a suspicious message...')">Message</button>
            </div>
          </div>
        </div>

        <!-- Trust Row -->
        <div class="cta-trust-row">
          <div class="cta-trust-item"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Free forever</div>
          <div class="cta-trust-sep"></div>
          <div class="cta-trust-item"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> No sign-up required</div>
          <div class="cta-trust-sep"></div>
          <div class="cta-trust-item"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Privacy first</div>
          <div class="cta-trust-sep"></div>
          <div class="cta-trust-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Results in &lt;2s</div>
        </div>

      </div>

      <style>
        /* ── SECTION CORE ─────────────────────── */
        .final-cta-section {
          position: relative;
          background: #01030A;
          color: #fff;
          padding: 160px 0 140px;
          overflow: hidden;
          font-family: var(--font, 'Inter', sans-serif);
        }

        /* ── BACKGROUND ─────────────────────── */
        .cta-bg-grid {
          position: absolute; inset: 0;
          background-image: 
            linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
          background-size: 40px 40px;
          mask-image: radial-gradient(ellipse 80% 80% at 50% 30%, black 10%, transparent 80%);
          -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 30%, black 10%, transparent 80%);
          pointer-events: none;
        }
        .cta-bg-glow {
          position: absolute; border-radius: 50%; filter: blur(120px); pointer-events: none;
        }
        .cta-glow-left {
          width: 500px; height: 500px; background: rgba(37,99,235,0.15); /* Blue */
          top: -100px; left: -100px; animation: ctaFloat 10s ease-in-out infinite;
        }
        .cta-glow-right {
          width: 400px; height: 400px; background: rgba(6,182,212,0.12); /* Cyan */
          bottom: -100px; right: -100px; animation: ctaFloat 12s ease-in-out infinite reverse;
        }
        .cta-glow-center {
          width: 600px; height: 600px; background: radial-gradient(circle, rgba(37,99,235,0.08) 0%, transparent 60%);
          top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        @keyframes ctaFloat {
          0%, 100% { transform: translate(0, 0); }
          50%      { transform: translate(30px, -40px); }
        }

        /* ── TYPOGRAPHY ─────────────────────── */
        .cta-eyebrow-wrapper { text-align: center; margin-bottom: 40px; }
        .cta-eyebrow {
          display: inline-flex; align-items: center; gap: 8px;
          padding: 8px 16px; border-radius: 100px;
          background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
          font-size: 0.8125rem; font-weight: 700; color: #94A3B8;
          letter-spacing: 0.06em; text-transform: uppercase;
          backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .pulse-dot {
          width: 8px; height: 8px; border-radius: 50%; background: #3B82F6;
          box-shadow: 0 0 0 0 rgba(59,130,246,0.6); animation: ctaPulseDot 2s infinite;
        }
        @keyframes ctaPulseDot {
          70% { box-shadow: 0 0 0 6px rgba(59,130,246,0); }
          100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
        }

        .cta-headline {
          display: flex; flex-direction: column; align-items: center; gap: 4px;
          font-size: clamp(3rem, 6.5vw, 6rem); font-weight: 800; line-height: 1.05; letter-spacing: -0.04em;
          margin-bottom: 32px;
        }
        .cta-line {
          opacity: 0; transform: translateY(40px);
          animation: ctaRise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .cta-l1 { animation-delay: 0.1s; }
        .cta-l2 { animation-delay: 0.25s; }
        .cta-l3 { animation-delay: 0.4s; }
        @keyframes ctaRise { to { opacity: 1; transform: translateY(0); } }

        .text-gray { color: #475569; }
        .text-gradient {
          background: linear-gradient(110deg, #3B82F6 0%, #22D3EE 50%, #E879F9 100%);
          -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 40px rgba(59,130,246,0.3));
        }

        .cta-sub {
          text-align: center; font-size: 1.125rem; color: #94A3B8; max-width: 500px; margin: 0 auto 56px; line-height: 1.6;
        }
        .cta-sub strong { color: #E2E8F0; font-weight: 600; }

        /* ── SEARCH WIDGET (GLASSMORPHISM) ─────────────────────── */
        .cta-widget-wrapper {
          max-width: 680px; margin: 0 auto 48px; padding: 0 20px;
          perspective: 1200px;
        }
        .cta-widget {
          position: relative;
          background: rgba(15, 23, 42, 0.4);
          backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
          border: 1px solid rgba(255,255,255,0.08);
          border-radius: 24px;
          box-shadow: 0 32px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
          overflow: hidden;
          transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
        }
        .cta-widget:hover {
          transform: translateY(-4px) rotateX(2deg);
          box-shadow: 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 0 1px rgba(59,130,246,0.3);
        }

        /* Laser line */
        .cta-widget-laser {
          position: absolute; top: 0; left: -100%; width: 50%; height: 1px;
          background: linear-gradient(90deg, transparent, #38BDF8, transparent);
          animation: ctaLaser 3s ease-in-out infinite;
        }
        @keyframes ctaLaser { 0% { left: -100%; } 100% { left: 200%; } }

        /* Widget Top */
        .cta-widget-top {
          display: flex; justify-content: space-between; align-items: center;
          padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.06);
          background: rgba(0,0,0,0.2);
        }
        .cta-engine-badge {
          display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 600; color: #64748B; letter-spacing: 0.05em; text-transform: uppercase;
        }
        .cta-live-badge {
          background: rgba(16,185,129,0.15); color: #34D399; font-size: 0.625rem; font-weight: 800; padding: 4px 10px; border-radius: 100px; letter-spacing: 0.1em; border: 1px solid rgba(16,185,129,0.2); animation: blinkGreen 1.5s infinite;
        }
        @keyframes blinkGreen { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Input Row */
        .cta-widget-input-row {
          display: flex; align-items: center; gap: 16px; padding: 24px;
        }
        .search-icon { color: #64748B; flex-shrink: 0; }
        #cta-input {
          flex: 1; background: transparent; border: none; outline: none;
          font-size: 1.125rem; color: #F8FAFC; font-weight: 500; font-family: var(--font, sans-serif);
        }
        #cta-input::placeholder { color: #475569; font-weight: 400; }
        
        .cta-analyze-btn {
          display: flex; align-items: center; gap: 8px;
          height: 52px; padding: 0 28px; border-radius: 14px;
          background: linear-gradient(135deg, #3B82F6 0%, #06B6D4 100%);
          color: #fff; font-size: 1rem; font-weight: 700; border: none; cursor: pointer;
          transition: all 0.2s; box-shadow: 0 8px 24px rgba(59,130,246,0.3);
        }
        .cta-analyze-btn:hover {
          transform: translateY(-2px); box-shadow: 0 12px 32px rgba(59,130,246,0.5); filter: brightness(1.1);
        }

        /* Tags */
        .cta-widget-tags { display: flex; gap: 10px; padding: 0 24px 24px; }
        .cta-tag {
          background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
          padding: 8px 16px; border-radius: 100px; font-size: 0.8125rem; font-weight: 600; color: #94A3B8;
          cursor: pointer; transition: all 0.2s;
        }
        .cta-tag:hover { background: rgba(255,255,255,0.08); color: #F1F5F9; }
        .cta-tag.active {
          background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); color: #93C5FD;
        }

        /* ── TRUST ROW ─────────────────────── */
        .cta-trust-row {
          display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap;
        }
        .cta-trust-item {
          display: flex; align-items: center; gap: 8px; font-size: 0.875rem; font-weight: 600; color: #64748B;
        }
        .cta-trust-item svg { width: 16px; height: 16px; fill: none; stroke: #475569; stroke-width: 2.5; }
        .cta-trust-sep { width: 4px; height: 4px; border-radius: 50%; background: #334155; }

        @media (max-width: 640px) {
          .cta-headline { font-size: 3rem; }
          .cta-widget-input-row { flex-direction: column; align-items: stretch; }
          .search-icon { display: none; }
          #cta-input { text-align: center; height: 48px; }
          .cta-analyze-btn { justify-content: center; }
          .cta-widget-tags { justify-content: center; flex-wrap: wrap; }
          .cta-trust-row { gap: 12px; }
          .cta-trust-sep { display: none; }
        }
      </style>
      <script>
        function ctaSelectTag(btn, placeholder) {
          document.querySelectorAll('.cta-tag').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('cta-input').placeholder = placeholder;
        }
      </script>
    </section>
